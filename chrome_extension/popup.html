<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q&Amatomer Launcher</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { width: 260px; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .main-btn {
      border: 2px solid transparent; border-radius: 10px; padding: 12px 6px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .main-btn:hover { opacity: .85; }
    .main-btn.active { border-color: #f8fafc; }
    #enterSide { background: #7c3aed; color: #fff; }
    #enterFull { background: #0ea5e9; color: #fff; }
    .icon { font-size: 18px; }
    .kbd { font-size: 10px; opacity: .6; font-weight: 400; }
    hr { border: 0; border-top: 1px solid #1e293b; margin: 0 0 10px; }
    #options {
      width: 100%; border: 0; border-radius: 8px; padding: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      background: #334155; color: #e2e8f0;
    }
    #status { min-height: 14px; margin-top: 6px; font-size: 11px; color: #fda4af; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Q&amp;Amatomer Launcher</h1>
    <div class="btns">
      <button class="main-btn" id="enterSide">
        <span class="icon">▌▐</span>
        サイド表示
        <span class="kbd">^⇧Q</span>
      </button>
      <button class="main-btn" id="enterFull">
        <span class="icon">⬜</span>
        フル表示
        <span class="kbd">^⇧Q</span>
      </button>
    </div>
    <hr>
    <button id="options">URL設定</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
